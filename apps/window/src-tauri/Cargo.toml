[package]
name = "krakenos-window"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "krakenos_window"

[dependencies]
url = "=2.5.8"
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
auto-launch = "=0.6.0"
open = "=5.4.5"
sys-locale = "=0.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
native-tls = "=0.2.18"

[build-dependencies]
tauri-build = "=2.7.4"
