<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KrakenOS</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --text: #1f2328;
        --muted: #57606a;
        --card: #ffffff;
        --border: #d0d7de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #8b949e;
          --card: #161b22;
          --border: #30363d;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, 'Segoe UI', sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 28rem;
        margin: 1rem;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0 0;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main role="status">
      <h1 id="titulo">KrakenOS</h1>
      <p id="detalle"></p>
      <p id="reintento"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
