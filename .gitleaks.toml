# Configuración de gitleaks para KrakenOS (US-92).
#
# Escaneo de secretos que **bloquea** el build en CI. Extiende el conjunto de
# reglas por defecto de gitleaks (claves privadas, tokens de proveedores, claves
# genéricas de alta entropía…) y añade una regla por ruta para las "joyas de la
# corona" de este repo: `keys/`, `.env`, bases de datos y material PEM/clave.
# Estos ficheros están en .gitignore; esta regla es la red de seguridad por si
# alguien quita el ignore y los commitea.

title = "KrakenOS gitleaks"

[extend]
# Mantiene TODAS las reglas por defecto de gitleaks y añade las de abajo.
useDefault = true

[[rules]]
id = "krakenos-sensitive-file"
description = "Fichero sensible commiteado (keys/, .env, *.db/.sqlite, *.pem/.key)"
# Cualquier contenido no vacío…
regex = '''(?s).+'''
# …en una de las rutas sensibles. `.env` ancla al final, así NO matchea
# `.env.example`/`.env.openwrt.example` (plantillas sin secretos reales).
path = '''(?:^|/)keys/|(?:^|/)\.env(?:\.local)?$|\.(?:db|sqlite|sqlite3|pem|key)$'''

[allowlist]
description = "No son secretos reales: plantillas, y valores de ejemplo/fixture."
# Las plantillas .env.example no llevan secretos reales.
paths = [
  '''(?:^|/)\.env(?:\.[a-z]+)?\.example$''',
]
# `localKey` de ejemplo (hex dummy) usada en fixtures de tests y en docs/tuya-setup.md.
# Son valores ficticios obvios, no credenciales. Cualquier otra cosa sigue bloqueando.
regexes = [
  '''abcdef0123456789''',
  '''0123456789abcdef''',
  # Convención para fixtures de test (US-234): todo valor falso que simule un
  # secreto lleva este marcador. Los tests de `log-redact` existen precisamente
  # para meter tokens en URLs y comprobar que se redactan, así que sus fixtures
  # SIEMPRE van a parecer secretos; el marcador los distingue sin abrir la mano
  # con un allowlist por ruta (que dejaría pasar un secreto de verdad).
  '''no-es-un-secreto''',
  # Entrada puntual: este fixture viajó en el commit 3f42d3c antes de adoptarse
  # el marcador, y gitleaks escanea TODO el historial (`fetch-depth: 0`), así que
  # cambiarlo en el árbol de trabajo no lo borra del pasado. No es un secreto:
  # era el `?token=` de ejemplo de un test de redacción.
  '''abc123def456''',
  # Clave de la tabla `Setting` que marca hecha la migración de ids IoT (US-243).
  # La regla `generic-api-key` la caza por el patrón `key: '…'` / `KEY = '…'`, pero
  # es un NOMBRE de ajuste, no una credencial: su valor es literalmente `'true'`.
  # No se arregla renombrando la constante — dos de los tres aciertos son
  # `where: { key: … }`, que es la API de Prisma, y el commit f09923e ya está en el
  # historial que gitleaks vuelve a escanear entero en cada ejecución.
  '''iot\.idsPrefixed\.v1''',
]
