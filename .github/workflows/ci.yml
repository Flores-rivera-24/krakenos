name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones anteriores de la misma rama/PR en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión de pnpm se lee de "packageManager" en package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Las claves RS256 están gitignored: se generan en cada ejecución.
      - name: Generate JWT keys (agent)
        run: bash scripts/gen-keys.sh
        working-directory: apps/agent

      # El Prisma Client no se commitea: hay que generarlo antes de typecheck/test.
      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Detecta fallos de bundling (tsup del agente / Vite de la web) antes de prod.
      - name: Build
        run: pnpm build

      # Presupuesto de rendimiento móvil (US-193): tamaños gzip del bundle web.
      # BLOQUEANTE: una dependencia pesada o un chunk sin split no entra en verde.
      - name: Bundle budget (web)
        run: pnpm --filter @krakenos/web budget

      - name: Test (con coverage informativo)
        run: pnpm test:coverage

      # Auditoría de dependencias (AUD-23): una CVE **crítica** en dependencias de
      # PRODUCCIÓN bloquea el pipeline. Datos de **OSV** (binario pineado): npm
      # retiró sus endpoints legacy de audit (410 desde 2026-07-15) y pnpm aún no
      # habla el bulk (pnpm/pnpm#11265), así que `pnpm audit` se quedó sin datos.
      # `scripts/audit-osv.mjs` cruza el informe con `pnpm list --prod`: lo de dev
      # (vitest/vite/tar) se reporta sin bloquear; el resumen completo va al log
      # (cubre también la auditoría informativa de US-60).
      - name: Audit dependencies via OSV (blocking on prod critical)
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=pnpm-lock.yaml --format=json > /tmp/osv.json || true
          node scripts/audit-osv.mjs /tmp/osv.json

  # Suite e2e de navegador (Playwright). US-189. Job aparte para no alargar
  # build-test; corre la app CONSTRUIDA con managers mock (ver docs/e2e.md).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys (agent)
        run: bash scripts/gen-keys.sh
        working-directory: apps/agent

      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      # El agente sirve apps/web/dist; e2e arranca el build, no el dev server.
      - name: Build
        run: pnpm build

      # Chromium + sus dependencias del sistema (libnspr4/libnss3/…): en el runner
      # de GitHub se instalan con --with-deps (apt vía sudo).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e

      # Trazas/vídeo/screenshots (solo se generan al fallar) como artefactos.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Smoke del instalador de un comando (US-216): corre en un Debian LIMPIO
  # (contenedor, sin Node preinstalado) desde la copia local del repo
  # (--from-local) y verifica que el agente construido responde /health/ready.
  # Sin systemd ni partes privilegiadas (no operan en contenedor, ver
  # docs/docker-limitations.md); esas se verifican en despliegue real (US-86).
  installer-smoke:
    name: Installer smoke (Debian limpio)
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer (from local tree, no service)
        run: |
          apt-get update -qq && apt-get install -y -qq curl git ca-certificates procps
          bash scripts/install.sh --yes --no-service --dir /opt/krakenos --from-local "$PWD"

      - name: Boot agent and probe /health/ready
        run: |
          cd /opt/krakenos/apps/agent
          NODE_ENV=production nohup node dist/index.js > /tmp/agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health/ready > /dev/null 2>&1; then
              echo "health/ready OK"
              exit 0
            fi
            sleep 1
          done
          echo "el agente no respondió a /health/ready"
          tail -50 /tmp/agent.log
          exit 1

  # Escaneo de secretos (gitleaks, BLOQUEANTE) + SAST (semgrep). US-92.
  # Job aparte para que corra en paralelo a build-test y falle de forma aislada.
  security:
    name: Secret scan · SAST
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` para que gitleaks escanee TODO el historial, no solo HEAD.
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (1) Secretos: BLOQUEA el build. Las joyas de la corona (keys/, .env, *.db)
      # están gitignored; gitleaks es la red de seguridad si alguien las commitea,
      # además de detectar claves privadas/tokens en cualquier fichero del historial.
      # Binario pin-eado a una versión exacta (sin "latest") → reproducible.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --verbose

      # (2) SAST: semgrep con engine pin-eado (imagen Docker por versión exacta) y
      # acotado al código fuente (src/), no a node_modules/tests/build. Reglas por
      # defecto + JS/TS. `--error` hace que cualquier hallazgo BLOQUEE el build.
      # Nota: los packs `p/*` se descargan del registro de semgrep en cada ejecución;
      # el engine está fijado, pero las reglas pueden evolucionar (ver reporte US-92).
      #
      # `--exclude-rule`: tres reglas son falsos positivos para este código y se
      # silencian de forma explícita (no se desactiva el resto del SAST):
      #   - express…direct-response-write: el backend es Fastify (API JSON, no HTML
      #     de Express); `reply.send` serializa JSON, no hay XSS reflejado.
      #   - detect-non-literal-regexp: el `new RegExp` de cisco-netconf.parsers usa un
      #     nombre de tag interno (no entrada de usuario), no es ReDoS explotable.
      #   - detect-insecure-websocket: el único match es un `ws://` dentro de un
      #     comentario doc de la CSP, no código.
      - name: SAST (semgrep)
        env:
          SEMGREP_VERSION: '1.95.0'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "semgrep/semgrep:${SEMGREP_VERSION}" \
            semgrep scan \
              --config p/default \
              --config p/javascript \
              --config p/typescript \
              --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write \
              --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
              --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
              --error \
              --metrics off \
              --disable-version-check \
              apps/agent/src apps/web/src packages/types/src
