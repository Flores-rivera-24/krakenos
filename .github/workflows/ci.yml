name: CI

on:
  push:
    branches: [main]
    # Un tag de versión corre la CI entera y, si todo pasa, el job `release` deja la release en borrador.
    tags: ['v*']
  pull_request:
  # Semanal aunque nadie empuje: un test con fecha que caduca o un aviso OSV nuevo
  # no deben pasar meses sin verse (main estuvo rojo dos meses sin que nadie lo viera).
  # Solo el job `release` escribe (y solo en tags v*): adjunta los paquetes de Linux a una release
  # en BORRADOR. La publicación a GHCR vive en docker.yml y va condicionada a `push`.
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

# Cancela ejecuciones anteriores de la misma rama/PR en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Token de solo lectura: ningún job escribe en el repo ni en PRs salvo `release`, que declara su propio
# `contents: write` (checkout, setup, upload-artifact y herramientas descargadas no lo necesitan).
permissions:
  contents: read

# ⚠️ Las acciones van en su mayor actual porque su RUNTIME (el Node con el que
# GitHub las ejecuta) pasó a `node24`. Las versiones viejas declaraban `node20`,
# que GitHub ya deprecó: los runners lo forzaban a 24 y lo avisaban en cada
# ejecución. Es una caducidad con fecha puesta por un tercero — cuando dejara de
# forzarse, TODOS los workflows habrían fallado a la vez y el fallo no se habría
# parecido a su causa.
#
# Eso es el runtime de la acción y NO la versión de Node del proyecto: `node-version`
# es el Node del producto (24 LTS; el 20 está fuera de soporte desde abril de 2026).
# Subirlo toca el instalador (`NODE_MAJOR`), el Dockerfile, `engines` y `tsup`.
#
# Requieren Actions Runner ≥ v2.327.1 (los hospedados por GitHub lo cumplen; si
# algún día se usa un runner propio, hay que actualizarlo antes).

jobs:
  build-test:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La versión de pnpm se lee de "packageManager" en package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Las claves RS256 están gitignored: se generan en cada ejecución.
      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      # El Prisma Client no se commitea: hay que generarlo antes de typecheck/test.
      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Formato (prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      # Detecta fallos de bundling (tsup del agente / Vite de la web) antes de prod.
      - name: Build
        run: pnpm build

      # Presupuesto de rendimiento móvil (US-193): tamaños gzip del bundle web.
      # BLOQUEANTE: una dependencia pesada o un chunk sin split no entra en verde.
      - name: Bundle budget (web)
        run: pnpm --filter @krakenos/web budget

      # Contraste WCAG AA de los tokens de la paleta (US-95 · US-231/AUD3-30).
      # BLOQUEANTE y, sobre todo, **correcto**: hasta US-231 el medidor leía `:root`
      # mientras la app renderiza con `<html class="dark">`, así que publicaba ✅
      # sobre valores que el usuario no ve (`kr-text-muted` daba 4,26:1 real, por
      # debajo del 4,5:1 de AA). Ahora compone cada tema como lo hace el navegador
      # y además corre aquí — antes ni siquiera se ejecutaba en CI.
      - name: Contraste WCAG de la paleta (web)
        run: node apps/web/scripts/check-contrast.mjs --check

      - name: Test (con coverage informativo)
        run: pnpm test:coverage

      # Pruebas de MUTACIÓN (Stryker). BLOQUEANTE al 75 %.
      #
      # Mide lo que la cobertura no puede: si los tests **detectan** un cambio de
      # comportamiento, o solo pasan por la línea sin comprobar nada. Cambia el
      # código a propósito (un `>` por `>=`, un `&&` por `||`) y exige que algún
      # test se entere. Un mutante que sobrevive es una línea que se ejecuta pero
      # no se vigila — y esas son invisibles para el porcentaje de coverage.
      #
      # Acotado a la lógica pura crítica (autorización por rol, tokens de API,
      # lockout anti-fuerza-bruta y máquina de estados de la alarma) con su propia
      # config de Vitest: la campaña entera tarda ~15 s. Sin acotar, Stryker
      # re-ejecutaría los ~5 min de suite del agente **por cada mutante**.
      # Ver docs/qa.md § Mutación.
      - name: Mutation testing (lógica crítica de auth y alarma)
        run: pnpm qa:mutation

      # Auditoría de dependencias (AUD-23): una CVE **crítica** en dependencias de
      # PRODUCCIÓN bloquea el pipeline. Datos de **OSV** (binario pineado): npm
      # retiró sus endpoints legacy de audit (410 desde 2026-07-15) y pnpm aún no
      # habla el bulk (pnpm/pnpm#11265), así que `pnpm audit` se quedó sin datos.
      # `scripts/audit-osv.mjs` cruza el informe con `pnpm list --prod`: lo de dev
      # (vitest/vite/tar) se reporta sin bloquear; el resumen completo va al log
      # (cubre también la auditoría informativa de US-60).
      - name: Audit dependencies via OSV (blocking on prod critical)
        run: |
          # Con reintentos: la descarga falló con `curl: (35) Recv failure` y puso
          # `main` en rojo por la red del runner, no por el código. Un gate que se
          # cae solo enseña a ignorar el rojo, que es como se llega a cinco pushes
          # rotos sin que nadie lo mire.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  /tmp/osv-scanner" | sha256sum --check -
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=pnpm-lock.yaml --format=json > /tmp/osv.json || true
          node scripts/audit-osv.mjs /tmp/osv.json

  # Suite del agente y de la web en Windows (Fase 11). Bloqueante desde que llevó 5 pasadas
  # verdes seguidas en main (hasta 30fb79b): si falla, el run sale rojo.
  # Los tests que no aplican en Windows saltan con motivo y están contados en
  # apps/agent/test/unit/saltos-por-plataforma.test.ts.
  windows:
    name: Tests en Windows
    runs-on: windows-latest
    # Un hijo colgado no debe gastar 6 h de minutos de Windows: el job falla a los 30 min.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      - name: Test (agente)
        run: pnpm --filter @krakenos/agent test

      # Aunque falle la del agente: la web es independiente y interesa ver las dos.
      - name: Test (web)
        if: ${{ !cancelled() }}
        run: pnpm --filter @krakenos/web test

  # Carpeta autocontenida (`pnpm package`, Fase 11): Node + agente + web + lanzador, un runner por
  # plataforma (no hay compilación cruzada). Prueba el paquete como lo usaría una persona: arranca,
  # responde /health/ready, sirve la web, se mueve de carpeta y se para sin dejar -wal/-shm.
  # `continue-on-error` en Windows y arm64 hasta llevar 5 pasadas verdes seguidas en main (como hizo
  # el job de Windows de los tests, PR #164); en cuanto las lleve, se quita `experimental`.
  package:
    name: Paquete (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, experimental: false }
          - { os: windows-latest, target: win-x64, experimental: true }
          - { os: ubuntu-24.04-arm, target: linux-arm64, experimental: true }
    # Todos los pasos con bash (existe también en los runners de Windows): un glob de shell
    # no se expande igual en pwsh y la verificación de Node necesita `gpgv` de Git for Windows.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm package` verifica la firma de Node con `gpgv`. En Windows viene con Git for Windows,
      # pero no está en el PATH de PowerShell/pnpm: se añade al FINAL, para que sus tar/sort/find
      # de MSYS no tapen a los de Windows.
      - name: Empaquetar (pnpm package)
        run: |
          command -v gpgv >/dev/null || export PATH="$PATH:/c/Program Files/Git/usr/bin"
          command -v gpgv
          pnpm package

      # Se comprime justo tras `pnpm package` (que ya corre `assertNoSecrets`) y antes del smoke, que
      # arranca el paquete y podría dejar estado (`.env`, claves, `*.db`) dentro de la carpeta.
      # Solo Linux. El zip de Windows NO sale en esta parte: el paquete lleva junctions de pnpm con
      # destino absoluto y, medido en CI, `tar.exe -a -cf` los guarda tal cual (el paquete
      # desempaquetado en otra ruta no arranca) y con `-L` el archivado falla por un enlace roto
      # (`app/agent/node_modules/bcrypt`). Lo resuelve el manifiesto de enlaces del instalador.
      - name: Archivo portable
        if: ${{ startsWith(matrix.target, 'linux-') }}
        run: |
          dir="$(ls -d out/krakenos-*-${{ matrix.target }} | head -n 1)"
          archivo="$(node scripts/package-archive.mjs "$dir")"
          echo "portable: $archivo"
          raiz="$(basename "$dir")"
          listado="$(tar -tvzf "$archivo")"
          echo "$listado" | grep -E "^-rwxr-xr-x .* $raiz/node/bin/node$"
          echo "$listado" | grep -E "^-rwxr-xr-x .* $raiz/bin/krakenos$"
          echo "$listado" | grep -E " $raiz/VERSION$"

      - name: Subir el portable
        if: ${{ startsWith(matrix.target, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-portable-${{ matrix.target }}
          path: out/portable/*
          retention-days: 7

      - name: Smoke del paquete
        run: |
          dir="$(ls -d out/krakenos-*-${{ matrix.target }} | head -n 1)"
          echo "paquete: $dir"
          node scripts/package-smoke.mjs "$dir"

      # `.deb` (US-287): se construyen dos (uno viejo `0.0.0~ci1` y el real), `lintian` no admite
      # errores y el ciclo de vida completo (instalar, actualizar con `krakenos.env` editado,
      # desinstalar, reinstalar y purgar) corre como root con systemd real, en x64 y en arm64.
      # Ojo: el arm64 es `continue-on-error` (experimental), así que su lintian o su ciclo de vida
      # pueden fallar con la CI en verde; solo el de x64 bloquea.
      - name: .deb (lintian y ciclo de vida)
        if: ${{ startsWith(matrix.target, 'linux-') }}
        run: |
          sudo apt-get update
          # needrestart (runners de Ubuntu) puede esperar una respuesta interactiva tras apt.
          sudo env NEEDRESTART_SUSPEND=1 apt-get install -y lintian
          dir="$(ls -d out/krakenos-*-${{ matrix.target }} | head -n 1)"
          old="$(node scripts/package-deb.mjs "$dir" --version 0.0.0~ci1)"
          new="$(node scripts/package-deb.mjs "$dir")"
          echo "viejo: $old"
          echo "nuevo: $new"
          # `alien-tag`: un override de una etiqueta que ESTA versión de lintian no conoce (cambian de nombre
          # entre versiones, y el runner y Debian estable no llevan la misma) no es un defecto del paquete.
          lintian --fail-on error --suppress-tags alien-tag "$old" "$new"
          sudo scripts/package/linux-lifecycle.sh deb "$old" "$new"
          # Solo el real: el viejo (`0.0.0~ci1`) existe para la prueba de actualización.
          echo "DEB_NUEVO=$new" >> "$GITHUB_ENV"

      # Lo que adjunta el job `release` (con la versión y la arquitectura en el nombre del archivo).
      - name: Subir el .deb
        if: ${{ startsWith(matrix.target, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-deb-${{ matrix.target }}
          path: ${{ env.DEB_NUEVO }}
          retention-days: 7

      # Negativo de la firma: con una SHASUMS256.txt alterada, la verificación de Node TIENE que
      # fallar (y por la firma, no por otra cosa). Si pasara, la verificación sería decorativa.
      - name: Negativo de la firma de Node (SHASUMS256.txt alterada)
        run: |
          command -v gpgv >/dev/null || export PATH="$PATH:/c/Program Files/Git/usr/bin"
          cache="$RUNNER_TEMP/node-alterada"
          rm -rf "$cache" && mkdir -p "$cache"
          cp .cache/node/*/SHASUMS256.txt .cache/node/*/SHASUMS256.txt.sig "$cache/"
          # 'Z' no es un dígito hexadecimal: la línea cambia siempre.
          sed '1s/./Z/' "$cache/SHASUMS256.txt" > "$cache/alterada.txt"
          mv "$cache/alterada.txt" "$cache/SHASUMS256.txt"
          if KRAKENOS_NODE_CACHE="$cache" node scripts/package.mjs --only-node > "$RUNNER_TEMP/negativo.log" 2>&1; then
            cat "$RUNNER_TEMP/negativo.log"
            echo "::error::la verificación de Node aceptó una SHASUMS256.txt alterada"
            exit 1
          fi
          cat "$RUNNER_TEMP/negativo.log"
          grep -q "no verifica" "$RUNNER_TEMP/negativo.log" || { echo "::error::falló, pero no por la firma"; exit 1; }
          echo "OK: la firma rechazó la SHASUMS256.txt alterada"

      - name: Subir el paquete
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-${{ matrix.target }}
          path: out/krakenos-*-${{ matrix.target }}
          retention-days: 7

      # upload-artifact no conserva el bit de ejecución: el paquete de Arch (job `package-arch`) parte
      # de este tar, que sí lo conserva, para no reconstruir Node y el agente.
      - name: Empaquetar la carpeta en tar (para el paquete de Arch)
        if: ${{ matrix.target == 'linux-x64' }}
        run: tar -cf "$RUNNER_TEMP/krakenos-linux-x64.tar" -C out "$(cd out && ls -d krakenos-*-linux-x64)"

      - name: Subir el tar (para el paquete de Arch)
        if: ${{ matrix.target == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-linux-x64-tar
          path: ${{ runner.temp }}/krakenos-linux-x64.tar
          retention-days: 7

  # Paquete de Arch / CachyOS (`pacman -U`, US-294). Se arma con `makepkg` como usuario NO root dentro de
  # `archlinux:base-devel` y se prueba (instalar, actualizar, desinstalar, reinstalar y purgar) en un
  # contenedor `archlinux` con systemd como PID 1. Las dos imágenes van fijadas por digest (índice multi-
  # arquitectura; leído el 2026-11-16): al subirlas, cambiar ambos y revisar. Arch es rolling y la imagen
  # fijada envejece: `pacman -Syu` pone al día lo que haga falta, pero el digest sigue siendo el punto de
  # partida reproducible. Bloqueante: es x64 y el contenedor tiene systemd; si la CI de otra imagen
  # (cgroups, systemd) fallara por el runner y no por el paquete, se baja a `continue-on-error`.
  package-arch:
    name: Paquete de Arch (linux-x64)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCH_BASE_DEVEL: archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
      ARCH_BASE: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Solo se arma el directorio de makepkg (no hace falta pnpm ni dependencias).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Bajar el paquete de linux-x64
        uses: actions/download-artifact@v8
        with:
          name: krakenos-linux-x64-tar
          path: ${{ runner.temp }}/dl

      - name: Armar el directorio de makepkg (uno viejo y el real)
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xf "$RUNNER_TEMP/dl/krakenos-linux-x64.tar" -C "$RUNNER_TEMP/pkg"
          dir="$(ls -d "$RUNNER_TEMP"/pkg/krakenos-*-linux-x64 | head -n 1)"
          old_dir="$(node scripts/package-arch.mjs "$dir" --version 0.0.0-ci.1 --out "$RUNNER_TEMP/arch")"
          new_dir="$(node scripts/package-arch.mjs "$dir" --out "$RUNNER_TEMP/arch")"
          echo "OLD_DIR=$(basename "$old_dir")" >> "$GITHUB_ENV"
          echo "NEW_DIR=$(basename "$new_dir")" >> "$GITHUB_ENV"

      # makepkg no corre como root: se crea `builder` con el mismo uid que el directorio montado.
      # namcap: los errores (E:) rompen el job; los avisos (W:) se ven pero se aceptan, porque salen de
      # lo que KrakenOS lleva dentro a propósito: el Node.js oficial y los `.node` precompilados del
      # agente (sin PIE ni RELRO completos, sin strip, librerías enlazadas que namcap no relaciona con
      # una dependencia, binarios de otras plataformas) y los scriptlets, que llaman a
      # systemd-sysusers/tmpfiles A MANO porque los hooks de pacman corren después del scriptlet.
      - name: makepkg y namcap (contenedor Arch base-devel, usuario no root)
        run: |
          docker run --rm -v "$RUNNER_TEMP/arch:/work" "$ARCH_BASE_DEVEL" bash -euo pipefail -c '
            # La imagen fijada envejece: sin un keyring al día, `pacman -Su` puede rechazar firmas nuevas.
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Su --noconfirm namcap hicolor-icon-theme
            useradd -m -u '"$(id -u)"' builder
            chown -R builder /work
            for d in /work/krakenos-*-arch; do
              ( cd "$d" && su builder -c "makepkg --noconfirm" )
            done
            for d in /work/krakenos-*-arch; do
              ( cd "$d"
                namcap PKGBUILD | tee /tmp/namcap-pkgbuild.txt
                namcap ./*.pkg.tar.zst | tee /tmp/namcap-pkg.txt
                if grep -E " E: " /tmp/namcap-pkgbuild.txt /tmp/namcap-pkg.txt; then exit 1; fi )
            done
          '

      - name: Ciclo de vida (contenedor Arch con systemd como PID 1)
        run: |
          docker run -d --name arch-systemd --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$RUNNER_TEMP/arch:/work:ro" \
            -v "$GITHUB_WORKSPACE/scripts/package/linux-lifecycle.sh:/usr/local/bin/linux-lifecycle.sh:ro" \
            --entrypoint /usr/lib/systemd/systemd "$ARCH_BASE"
          for i in $(seq 1 60); do
            st="$(docker exec arch-systemd systemctl is-system-running 2>/dev/null || true)"
            case "$st" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd: $st"
          case "$st" in running|degraded) ;; *) docker logs arch-systemd | tail -n 30; exit 1 ;; esac
          # `pacman -U` resuelve las dependencias con la base sincronizada: el script no hace -Sy y la base ni trae hicolor-icon-theme.
          docker exec arch-systemd pacman -Sy --noconfirm archlinux-keyring hicolor-icon-theme
          old="$(docker exec arch-systemd sh -c "ls /work/$OLD_DIR/*.pkg.tar.zst")"
          new="$(docker exec arch-systemd sh -c "ls /work/$NEW_DIR/*.pkg.tar.zst")"
          docker exec -e GITHUB_ACTIONS arch-systemd bash /usr/local/bin/linux-lifecycle.sh arch "$old" "$new"

      # Lo que adjunta el job `release`: solo el paquete real (el viejo es para la prueba de actualización).
      - name: Subir el paquete de Arch
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-arch
          path: ${{ runner.temp }}/arch/${{ env.NEW_DIR }}/*.pkg.tar.zst
          retention-days: 7

  # Ventana de escritorio de Windows (Tauri 2, apps/window). Compila el crate, corre `cargo test`
  # y clippy estricto y construye el .exe sin instalador. Rust va fijado a la versión exacta de
  # apps/window/src-tauri/rust-toolchain.toml (si divergen, el gate ventana-sin-ipc.test.ts falla).
  # `continue-on-error` hasta llevar 5 pasadas verdes seguidas en main (como el job de Windows de los
  # tests); en cuanto las lleve, se quita.
  ventana:
    name: ventana (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rustup viene en el runner; se fija la versión exacta y no se usa ninguna acción de terceros.
      - name: Rust 1.99.1 (rustup)
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.1
          rustc --version

      - name: Caché de cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/window/src-tauri/target
          key: ventana-${{ runner.os }}-rust-1.99.1-${{ hashFiles('apps/window/src-tauri/Cargo.lock') }}

      - name: Formato (cargo fmt)
        working-directory: apps/window/src-tauri
        run: cargo fmt --check

      - name: Test (cargo test)
        working-directory: apps/window/src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: apps/window/src-tauri
        run: cargo clippy --locked -- -D warnings

      # `--no-bundle`: solo el .exe; el instalador NSIS es otra historia.
      - name: Compilar la ventana (tauri build --no-bundle)
        run: pnpm --filter @krakenos/window tauri build --no-bundle -- --locked

      - name: Subir el .exe
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-window-win-x64
          path: apps/window/src-tauri/target/release/krakenos-window.exe
          retention-days: 7

  # Instalador de Windows (NSIS por el bundler de Tauri, con la carpeta de `pnpm package` dentro) y su
  # prueba en silencio (scripts/installer-smoke-windows.ps1: una función por fase). El paquete se
  # construye AQUÍ y no se baja de un artefacto: `upload-artifact` no conserva las junctions de pnpm.
  # `continue-on-error` hasta 5 pasadas verdes seguidas en main (como `ventana`).
  instalador-windows:
    name: instalador (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust 1.99.1 (rustup)
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Caché de cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/window/src-tauri/target
          key: ventana-${{ runner.os }}-rust-1.99.1-${{ hashFiles('apps/window/src-tauri/Cargo.lock') }}

      - name: Empaquetar (pnpm package)
        run: |
          command -v gpgv >/dev/null || export PATH="$PATH:/c/Program Files/Git/usr/bin"
          command -v gpgv
          pnpm package

      # Tope de la ruta relativa más larga del paquete: makensis y la extracción de NSIS no usan el prefijo
      # de rutas largas, así que `Program Files\KrakenOS\` (25) + la ruta tiene que quedar bajo 260.
      # Medido: ver «Resultados del spike» (US-285/286); el tope deja margen sobre lo medido.
      - name: Construir el instalador NSIS
        run: |
          dir="$(ls -d out/krakenos-*-win-x64 | head -n 1)"
          max="$(cd "$dir" && find . -type f | awk '{ if (length($0) > m) m = length($0) } END { print m }')"
          echo "ruta relativa más larga del paquete: $max caracteres (tope 200)"
          test "$max" -le 200
          node scripts/package-windows.mjs "$dir" | tee installer-path.txt
          # El hook usa `${StrLoc}` (StrFunc.nsh) sin declararlo: lo declara la plantilla de Tauri. Si una
          # versión nueva de Tauri lo quita, el .nsi no compilaría; esto lo dice con nombre antes.
          nsi=apps/window/src-tauri/target/release/nsis/x64/installer.nsi
          grep -Eq '^[[:space:]]*!include[[:space:]]+"?StrFunc\.nsh' "$nsi" || { echo "::error::el installer.nsi de Tauri ya no incluye StrFunc.nsh (lo usa el hook)"; exit 1; }
          grep -Eq '^[[:space:]]*\$\{StrLoc\}[[:space:]]*$' "$nsi" || { echo "::error::el installer.nsi de Tauri ya no declara \${StrLoc} (lo usa el hook)"; exit 1; }
          grep -q 'nsis_tauri_utils::RunAsUser' "$nsi" || { echo "::error::el installer.nsi de Tauri ya no trae nsis_tauri_utils::RunAsUser (lo usa el hook para abrir la ventana sin elevar)"; exit 1; }

      # Negativo de la suma de WinSW: con un byte alterado en la caché, `package-windows.mjs` TIENE que
      # fallar por la suma (y no por otra cosa). Si pasara, la verificación sería decorativa.
      - name: Negativo de la suma de WinSW (binario alterado)
        run: |
          dir="$(ls -d out/krakenos-*-win-x64 | head -n 1)"
          cache="$RUNNER_TEMP/winsw-alterado"
          rm -rf "$cache" && mkdir -p "$cache"
          cp .cache/winsw/*.exe "$cache/"
          f="$(ls "$cache"/*.exe | head -n 1)"
          printf 'Z' | dd of="$f" bs=1 seek=100 conv=notrunc 2>/dev/null
          if KRAKENOS_WINSW_CACHE="$cache" node scripts/package-windows.mjs "$dir" > "$RUNNER_TEMP/negativo-winsw.log" 2>&1; then
            cat "$RUNNER_TEMP/negativo-winsw.log"
            echo "::error::la verificación de WinSW aceptó un binario alterado"
            exit 1
          fi
          cat "$RUNNER_TEMP/negativo-winsw.log"
          grep -q "WinSW no verifica" "$RUNNER_TEMP/negativo-winsw.log" || { echo "::error::falló, pero no por la suma"; exit 1; }
          echo "OK: la suma rechazó el WinSW alterado"

      # El mismo paquete con otra versión: solo hace falta un instalador «viejo» para probar la actualización
      # encima (datos, CA, servicio y reglas intactos). Reutiliza el paquete ya construido: solo repite el bundle.
      - name: Construir el instalador 0.0.1 (prueba de actualización)
        run: |
          dir="$(ls -d out/krakenos-*-win-x64 | head -n 1)"
          node scripts/package-windows.mjs "$dir" --version 0.0.1 | tee installer-old-path.txt

      - name: Probar el instalador (en silencio)
        shell: pwsh
        run: |
          $setup = (Get-Content installer-path.txt | Select-Object -Last 1).Trim()
          $old = (Get-Content installer-old-path.txt | Select-Object -Last 1).Trim()
          ./scripts/installer-smoke-windows.ps1 -Setup $setup -OldSetup $old

      - name: Subir el instalador
        uses: actions/upload-artifact@v7
        with:
          name: krakenos-setup-win-x64
          path: out/KrakenOS-Setup-*-x64.exe
          retention-days: 7

  # Suite e2e de navegador (Playwright). US-189. Job aparte para no alargar
  # build-test; corre la app CONSTRUIDA con managers mock (ver docs/e2e.md).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      # El agente sirve apps/web/dist; e2e arranca el build, no el dev server.
      - name: Build
        run: pnpm build

      # Chromium + sus dependencias del sistema (libnspr4/libnss3/…): en el runner
      # de GitHub se instalan con --with-deps (apt vía sudo).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e

      # Trazas/vídeo/screenshots (solo se generan al fallar) como artefactos.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Smoke del instalador de un comando (US-216): corre en un Debian LIMPIO
  # (contenedor, sin Node preinstalado) desde la copia local del repo
  # (--from-local) y verifica que el agente construido responde /health/ready.
  # Sin systemd ni partes privilegiadas (no operan en contenedor, ver
  # docs/docker-limitations.md); esas se verifican en despliegue real (US-86).
  installer-smoke:
    name: Installer smoke (Debian limpio)
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run installer (from local tree, no service)
        run: |
          apt-get update -qq && apt-get install -y -qq curl git ca-certificates procps sudo
          # Con --no-service el instalador no crea el usuario; se crea aquí para que el
          # grupo del material TLS (root:krakenos) y las comprobaciones "como krakenos"
          # sean las de una instalación real.
          useradd --system --home /opt/krakenos --shell /usr/sbin/nologin krakenos
          bash scripts/install.sh --yes --no-service --dir /opt/krakenos --from-local "$PWD" | tee /tmp/install-1.log

      - name: Boot agent and probe /health/ready
        run: |
          cd /opt/krakenos/apps/agent
          NODE_ENV=production nohup node dist/index.js > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 30); do
            # HTTPS por defecto: sin Tailscale el instalador monta la CA local, así
            # que la sonda confía en ESA CA (no -k) y de paso prueba que el
            # certificado del servidor la valida para 127.0.0.1.
            if curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/health/ready > /dev/null 2>&1; then
              echo "health/ready OK (HTTPS, verificado contra la CA local)"
              exit 0
            fi
            sleep 1
          done
          echo "el agente no respondió a /health/ready"
          tail -50 /tmp/agent.log
          exit 1

      # AUD3-06: el instalador dejaba .env, la DB y data/ a 0644 → cualquier cuenta
      # local leía credenciales SSH del router, rtspUrl con contraseñas y hashes.
      - name: Secrets are not world-readable
        run: |
          agent=/opt/krakenos/apps/agent
          fail=0
          check() { # fichero_o_dir modo_esperado
            actual="$(stat -c '%a' "$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 tiene modo $actual, se esperaba $2"
              fail=1
            else
              echo "OK  $1 → $actual"
            fi
          }
          check "$agent/.env" 600
          check "$agent/keys" 700
          for f in "$agent"/keys/*.pem; do check "$f" 600; done
          for f in "$agent"/prisma/*.db; do [ -e "$f" ] && check "$f" 600; done
          exit $fail

      # AUD3-23: los extras se omitían en SILENCIO (sin TTY, confirm() decía "no").
      # Ahora son opt-in por bandera y lo que queda fuera se dice en voz alta.
      - name: Installer reports what was left out
        run: |
          grep -q "Qué quedó FUERA" /tmp/install-1.log
          grep -q -- "--with-ffmpeg" /tmp/install-1.log
          grep -q -- "--with-helper" /tmp/install-1.log
          echo "el resumen de extras omitidos está presente"

      # Idempotencia real: re-ejecutar NO debe regenerar .env ni las claves (sería
      # invalidar todas las sesiones y perder la config en cada reinstalación).
      - name: Re-run installer (idempotence)
        run: |
          agent=/opt/krakenos/apps/agent
          sha_before="$(sha256sum "$agent/.env" "$agent/keys/jwt-private.pem" | sha256sum)"
          # Marcador en data/ para comprobar que el estado del usuario se conserva.
          mkdir -p "$agent/data" && echo 'no me borres' > "$agent/data/smoke-marker"
          kill "$(cat /tmp/agent.pid)" 2>/dev/null || true
          bash scripts/install.sh --yes --no-service --dir /opt/krakenos --from-local "$PWD" > /tmp/install-2.log 2>&1 \
            || { tail -30 /tmp/install-2.log; exit 1; }
          sha_after="$(sha256sum "$agent/.env" "$agent/keys/jwt-private.pem" | sha256sum)"
          [ "$sha_before" = "$sha_after" ] || { echo "::error::la re-ejecución regeneró .env o las claves"; exit 1; }
          grep -q 'no me borres' "$agent/data/smoke-marker" || { echo "::error::se perdió data/"; exit 1; }
          echo "re-ejecución idempotente: .env, claves y data/ intactos"

      - name: Agent still boots after re-install
        run: |
          cd /opt/krakenos/apps/agent
          NODE_ENV=production nohup node dist/index.js > /tmp/agent2.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 30); do
            curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/health/ready > /dev/null 2>&1 && exit 0
            sleep 1
          done
          tail -50 /tmp/agent2.log
          exit 1

      # Root nunca ejecuta ni escribe nada que el usuario del servicio pueda modificar:
      # el árbol de instalación es suyo, así que el script de renovación (que ejecuta
      # un timer de root) y la clave de la CA viven fuera. Cada comprobación negativa
      # corre COMO el usuario del servicio.
      - name: TLS material is out of the service's reach
        run: |
          fail=0
          check() { # ruta propietario:grupo modo
            actual="$(stat -c '%U:%G %a' "$1")"
            if [ "$actual" != "$2 $3" ]; then echo "::error::$1 es $actual, se esperaba $2 $3"; fail=1; else echo "OK  $1 → $actual"; fi
          }
          check /usr/local/lib/krakenos root:root 755
          check /usr/local/lib/krakenos/local-ca.js root:root 755
          check /etc/krakenos/ca root:root 700
          check /etc/krakenos/ca/krakenos-ca-key.pem root:root 600
          check /etc/krakenos/tls root:krakenos 750
          check /etc/krakenos/tls/agent-key.pem root:krakenos 640
          # El servicio NO puede leer la clave de la CA ni modificar el script de root…
          if sudo -u krakenos test -r /etc/krakenos/ca/krakenos-ca-key.pem; then echo "::error::krakenos lee la clave de la CA"; fail=1; fi
          if sudo -u krakenos test -w /usr/local/lib/krakenos/local-ca.js; then echo "::error::krakenos puede escribir el script de root"; fail=1; fi
          # root ejecuta ese fichero con un node concreto (el del sistema si es de root; si
          # no, la copia de root en /usr/local/lib/krakenos/node): ni el node ni NINGUNO de
          # sus directorios pueden ser del servicio ni escribibles por él.
          node_bin="$(readlink -f "$(command -v node)")"
          if [ -e /usr/local/lib/krakenos/node ]; then node_bin=/usr/local/lib/krakenos/node; fi
          p="$node_bin"
          while :; do
            [ "$(stat -c %u "$p")" = 0 ] || { echo "::error::$p no es de root (lo ejecuta root)"; fail=1; }
            if sudo -u krakenos test -w "$p"; then echo "::error::krakenos puede escribir $p, que ejecuta root"; fail=1; fi
            [ "$p" = / ] && break
            p="$(dirname "$p")"
          done
          # La copia de root arranca SOLA (sin node_modules) y no toca la CA existente.
          before="$(sha256sum /etc/krakenos/tls/krakenos-ca.pem)"
          KRAKENOS_CERTS_DIR=/etc/krakenos/tls KRAKENOS_KEYS_DIR=/etc/krakenos/ca KRAKENOS_TLS_GROUP=krakenos \
            "$node_bin" /usr/local/lib/krakenos/local-ca.js || { echo "::error::la copia de root de local-ca.js falló"; fail=1; }
          [ "$before" = "$(sha256sum /etc/krakenos/tls/krakenos-ca.pem)" ] || { echo "::error::la renovación cambió la CA"; fail=1; }
          echo "OK  root ejecuta $node_bin /usr/local/lib/krakenos/local-ca.js"
          if sudo -u krakenos test -w /etc/krakenos/tls; then echo "::error::krakenos puede escribir en /etc/krakenos/tls"; fail=1; fi
          # …pero SÍ lee la clave del servidor (por grupo) para servir HTTPS.
          sudo -u krakenos test -r /etc/krakenos/tls/agent-key.pem || { echo "::error::krakenos no lee la clave del servidor"; fail=1; }
          # El .env apunta fuera del árbol de instalación.
          grep -q '^TLS_KEY_PATH=/etc/krakenos/tls/agent-key.pem$' /opt/krakenos/apps/agent/.env || { echo "::error::TLS_KEY_PATH no apunta a /etc/krakenos"; fail=1; }
          # mDNS: el paquete está instalado (en el contenedor no hay systemd/dbus, así
          # que NO se exige el demonio activo: sería un falso verde o un falso rojo).
          dpkg -s avahi-daemon > /dev/null 2>&1 || { echo "::error::avahi-daemon no está instalado"; fail=1; }
          exit $fail

      # La CA se publica sin auth (es pública por definición) y NUNCA se filtra una clave.
      - name: CA certificate is served and contains no private key
        run: |
          agent=/opt/krakenos/apps/agent
          curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/api/system/ca-cert -o /tmp/served-ca.crt
          ! grep -q "PRIVATE KEY" /tmp/served-ca.crt
          cmp /tmp/served-ca.crt /etc/krakenos/tls/krakenos-ca.pem
          echo "ca-cert servido, idéntico al fichero y sin claves"

      # --uninstall conserva los datos (lo que promete) y --purge no deja residuos.
      - name: Uninstall keeps data, purge leaves nothing
        run: |
          kill "$(cat /tmp/agent.pid)" 2>/dev/null || true
          bash scripts/install.sh --yes --uninstall --dir /opt/krakenos | tee /tmp/uninstall.log
          grep -q "Se conserva /opt/krakenos" /tmp/uninstall.log
          test -f /opt/krakenos/apps/agent/keys/jwt-private.pem || { echo "::error::--uninstall borró las claves"; exit 1; }
          test -f /opt/krakenos/apps/agent/data/smoke-marker || { echo "::error::--uninstall borró data/"; exit 1; }
          test ! -f /etc/systemd/system/krakenos.service
          bash scripts/install.sh --yes --uninstall --purge --dir /opt/krakenos
          test ! -d /opt/krakenos || { echo "::error::--purge dejó residuos en /opt/krakenos"; exit 1; }
          echo "uninstall/purge correctos"

  # Escaneo de secretos (gitleaks, BLOQUEANTE) + SAST (semgrep). US-92.
  # Job aparte para que corra en paralelo a build-test y falle de forma aislada.
  security:
    name: Secret scan · SAST
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` para que gitleaks escanee TODO el historial, no solo HEAD.
      - name: Checkout (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # (1) Secretos: BLOQUEA el build. Las joyas de la corona (keys/, .env, *.db)
      # están gitignored; gitleaks es la red de seguridad si alguien las commitea,
      # además de detectar claves privadas/tokens en cualquier fichero del historial.
      # Binario pin-eado a una versión exacta (sin "latest") → reproducible.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --verbose

      # (2) SAST: semgrep con engine pin-eado (imagen Docker por versión exacta) y
      # acotado al código fuente (src/), no a node_modules/tests/build. Reglas por
      # defecto + JS/TS. `--error` hace que cualquier hallazgo BLOQUEE el build.
      # Nota: los packs `p/*` se descargan del registro de semgrep en cada ejecución;
      # el engine está fijado, pero las reglas pueden evolucionar (ver reporte US-92).
      # Los falsos positivos se suprimen por línea (`nosemgrep` con su porqué).
      # Única regla excluida: `direct-response-write` es de Express (marca como XSS
      # todo `res.send(objeto)`); el agente es Fastify y serializa por el schema de
      # `response`. Medido el 2026-11-11: 31 falsos positivos y 0 aciertos.
      - name: SAST (semgrep)
        env:
          SEMGREP_VERSION: '1.95.0'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "semgrep/semgrep:${SEMGREP_VERSION}" \
            semgrep scan \
              --config p/default \
              --config p/javascript \
              --config p/typescript \
              --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write \
              --error \
              --metrics off \
              --disable-version-check \
              apps/agent/src apps/web/src packages/types/src

      # (3) shellcheck sobre los scripts de shell (US-231/AUD3-32). `install.sh`
      # son 400+ líneas que se ejecutan **como root** por `curl | sudo bash`, y
      # hasta ahora no pasaban por semgrep (acotado a `src/`) ni por ningún linter
      # de shell. El helper privilegiado va igual: es la última frontera antes de
      # root. BLOQUEANTE.
      - name: Shellcheck (scripts que corren como root)
        env:
          SHELLCHECK_VERSION: '0.10.0'
          SHELLCHECK_SHA256: '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
        run: |
          # Version fijada (el paquete de apt cambia con la imagen del runner) y tarball
          # verificado por sha256 antes de ejecutar nada.
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          export PATH="$RUNNER_TEMP/shellcheck:$PATH"
          shellcheck --version
          # -x: krakenos-setup carga la biblioteca compartida (su `source=` la resuelve).
          shellcheck -x --severity=warning \
            scripts/install.sh \
            scripts/lib/krakenos-system.sh \
            scripts/package/linux-lifecycle.sh \
            packaging/linux/common/krakenos-setup \
            packaging/linux/common/krakenos-open \
            packaging/linux/deb/postinst \
            packaging/linux/deb/prerm \
            packaging/linux/deb/postrm \
            packaging/linux/arch/krakenos.install \
            scripts/package/launchers/krakenos \
            apps/agent/scripts/krakenos-helper.sh \
            docker/entrypoint.sh

  # Release (solo en tags v*): adjunta los paquetes de Linux (.deb amd64 y arm64, el de Arch) y los
  # portables .tar.gz (linux-x64/arm64) con su SHA256SUMS a la release de GitHub, creada como BORRADOR para que el dueño la revise y la publique
  # a mano. Espera a todo job bloqueante; `ventana` es experimental y no entra. ⚠️ El arm64 de `package`
  # es `continue-on-error` (su fallo no pone rojo el run): por eso el job comprueba que cada archivo
  # esperado exista en vez de fiarse de `needs`. El zip de Windows y el `.exe` de la ventana quedan fuera (parte B).
  release:
    name: Release (borrador con los paquetes y portables de Linux)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-test, windows, package, package-arch, e2e, installer-smoke, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # las notas leen los tags y commits anteriores

      # El tag tiene que ser `v` + la versión de package.json: de ahí salen las versiones de los
      # .deb y del paquete de Arch (apps/* y packages/* no llevan una versión propia que importe).
      - name: Comprobar que el tag coincide con la versión
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::el tag $GITHUB_REF_NAME no es v$version (package.json)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Bajar los .deb, el paquete de Arch y los portables de Linux
        uses: actions/download-artifact@v8
        with:
          pattern: krakenos-{deb-*,arch,portable-*}
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      # Exactamente cinco archivos: si falta uno (p. ej. el arm64 experimental falló) o sobra un paquete
      # de Arch, el script falla y no se publica a medias. Lo probado está en assemble-release.test.ts.
      - name: Reunir los archivos y generar SHA256SUMS
        run: |
          ls -l "$RUNNER_TEMP/dl"
          node scripts/release/assemble.mjs "$RUNNER_TEMP/dl" release "$VERSION"

      # Manifiesto firmado (ed25519) que lee el actualizador del agente. Sin el secreto el paso FALLA a
      # propósito: una release sin firma no se podría instalar desde la app. Va tras SHA256SUMS, así que
      # este no lo incluye (no es un paquete).
      - name: Firmar el manifiesto
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/release/sign-manifest.mjs "$GITHUB_WORKSPACE/release" "$VERSION" 0.2.0

      # Notas de los commits entre este tag y el anterior (falla si no hay anterior).
      - name: Notas de la versión
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/notes.mjs "$GITHUB_REF_NAME" "$VERSION" release > "$RUNNER_TEMP/notes.md"

      # Borrador: no es pública hasta que el dueño la publica a mano. Si la release ya existe (creada a
      # mano antes), solo se suben los archivos; --clobber permite repetir el job.
      - name: Adjuntar a la release (borrador)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # El zip de Windows (parte B) se suma aquí cuando exista.
          gh release upload "$TAG" release/*.deb release/*.pkg.tar.zst release/*.tar.gz release/SHA256SUMS \
            release/manifest.json release/manifest.json.sig --clobber

  # Ensayo del job `release` en cada PR y push a main: corre los mismos scripts (assemble, sign-manifest,
  # notes) sobre los artefactos de este run y NO publica nada (solo lectura, sin gh release, sin subir
  # artefactos). Así un hueco de la release (falta un archivo, las notas filtran un id interno, el
  # manifiesto no firma) sale rojo en el PR y no el día del tag.
  # Firma: en `push` a main usa el secreto real UPDATE_SIGNING_KEY SIN UPDATE_VERIFY_PUBLIC_KEY, así
  # sign-manifest comprueba que el secreto casa con la pública embebida; en los PR (que no ven secretos, y
  # menos los de un fork) usa un par ed25519 efímero enmascarado que no sale del job.
  # Es `continue-on-error` hasta que los `package` de win-x64 y arm64 (experimentales) sean bloqueantes:
  # mientras tanto un rojo avisa de que el tag real fallaría por lo mismo. NO cubre (en un PR) que el
  # secreto real case con la pública embebida: lo comprueba el push a main y, antes de publicar nada, el
  # tag (la release es borrador).
  release-ensayo:
    name: Ensayo de la release (sin publicar)
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/v') }}
    needs: [package, package-arch]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # las notas leen los tags y commits anteriores

      - name: Versión de package.json
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Bajar los .deb, el paquete de Arch y los portables de Linux
        uses: actions/download-artifact@v8
        with:
          pattern: krakenos-{deb-*,arch,portable-*}
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      - name: Reunir los archivos y generar SHA256SUMS
        run: |
          ls -l "$RUNNER_TEMP/dl"
          node scripts/release/assemble.mjs "$RUNNER_TEMP/dl" release "$VERSION"

      # La privada se enmascara línea a línea y solo viaja por $GITHUB_ENV; nunca se imprime.
      - name: Clave de firma efímera
        if: ${{ github.event_name != 'push' }}
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const { appendFileSync } = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            const priv = privateKey.export({ type: "pkcs8", format: "pem" });
            const pub = publicKey.export({ type: "spki", format: "pem" });
            for (const l of priv.split("\n").filter(Boolean)) console.log("::add-mask::" + l);
            appendFileSync(process.env.GITHUB_ENV,
              "UPDATE_SIGNING_KEY<<EOF_K\n" + priv + "EOF_K\nUPDATE_VERIFY_PUBLIC_KEY<<EOF_P\n" + pub + "EOF_P\n");
          '

      - name: Firmar el manifiesto (secreto real)
        if: ${{ github.event_name == 'push' }}
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/release/sign-manifest.mjs "$GITHUB_WORKSPACE/release" "$VERSION" 0.2.0

      - name: Firmar el manifiesto (clave efímera)
        if: ${{ github.event_name != 'push' }}
        run: node scripts/release/sign-manifest.mjs "$GITHUB_WORKSPACE/release" "$VERSION" 0.2.0

      - name: Notas de la versión
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/notes.mjs HEAD "$VERSION" release > "$RUNNER_TEMP/notes.md"

      # Lo que el job `release` daría por bueno: los archivos existen, SHA256SUMS tiene una línea por
      # archivo de assemble.mjs y la firma verifica (con la efímera en PR, con la embebida en push).
      - name: Comprobar el resultado
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import { existsSync, readFileSync, statSync } from "node:fs";
            import { expectedAssets } from "./scripts/release/assemble.mjs";
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            const v = process.env.VERSION;
            for (const f of ["release/manifest.json", "release/manifest.json.sig", "release/SHA256SUMS"])
              if (!existsSync(f)) fail("falta " + f);
            const notas = process.env.RUNNER_TEMP + "/notes.md";
            if (!existsSync(notas) || statSync(notas).size === 0) fail("notes.md vacío");
            const e = expectedAssets(v);
            const n = e.deb.length + 1 + e.portables.length;
            const lineas = readFileSync("release/SHA256SUMS", "utf8").trim().split("\n").length;
            if (lineas !== n) fail("SHA256SUMS tiene " + lineas + " líneas y se esperaban " + n);
            const emb = readFileSync("apps/agent/src/system/update-signing-key.ts", "utf8");
            const pem = process.env.UPDATE_VERIFY_PUBLIC_KEY ?? /-----BEGIN PUBLIC KEY-----[^`]+?-----END PUBLIC KEY-----/.exec(emb)?.[0];
            const ok = crypto.verify(null, readFileSync("release/manifest.json"), crypto.createPublicKey(pem),
              Buffer.from(readFileSync("release/manifest.json.sig", "utf8").trim(), "base64"));
            if (!ok) fail("la firma de manifest.json no verifica");
            console.log("ensayo ok: " + lineas + " archivos en SHA256SUMS y firma verificada");
          '
