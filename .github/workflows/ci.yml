name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Semanal aunque nadie empuje: un test con fecha que caduca o un aviso OSV nuevo
  # no deben pasar meses sin verse (main estuvo rojo dos meses sin que nadie lo viera).
  # Ningún job de este workflow publica nada; la publicación a GHCR vive en docker.yml
  # y va condicionada a `push`.
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

# Cancela ejecuciones anteriores de la misma rama/PR en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ Las acciones van en su mayor actual porque su RUNTIME (el Node con el que
# GitHub las ejecuta) pasó a `node24`. Las versiones viejas declaraban `node20`,
# que GitHub ya deprecó: los runners lo forzaban a 24 y lo avisaban en cada
# ejecución. Es una caducidad con fecha puesta por un tercero — cuando dejara de
# forzarse, TODOS los workflows habrían fallado a la vez y el fallo no se habría
# parecido a su causa.
#
# Eso es el runtime de la acción y NO la versión de Node del proyecto: `node-version`
# es el Node del producto (24 LTS; el 20 está fuera de soporte desde abril de 2026).
# Subirlo toca el instalador (`NODE_MAJOR`), el Dockerfile, `engines` y `tsup`.
#
# Requieren Actions Runner ≥ v2.327.1 (los hospedados por GitHub lo cumplen; si
# algún día se usa un runner propio, hay que actualizarlo antes).

jobs:
  build-test:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La versión de pnpm se lee de "packageManager" en package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Las claves RS256 están gitignored: se generan en cada ejecución.
      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      # El Prisma Client no se commitea: hay que generarlo antes de typecheck/test.
      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Formato (prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      # Detecta fallos de bundling (tsup del agente / Vite de la web) antes de prod.
      - name: Build
        run: pnpm build

      # Presupuesto de rendimiento móvil (US-193): tamaños gzip del bundle web.
      # BLOQUEANTE: una dependencia pesada o un chunk sin split no entra en verde.
      - name: Bundle budget (web)
        run: pnpm --filter @krakenos/web budget

      # Contraste WCAG AA de los tokens de la paleta (US-95 · US-231/AUD3-30).
      # BLOQUEANTE y, sobre todo, **correcto**: hasta US-231 el medidor leía `:root`
      # mientras la app renderiza con `<html class="dark">`, así que publicaba ✅
      # sobre valores que el usuario no ve (`kr-text-muted` daba 4,26:1 real, por
      # debajo del 4,5:1 de AA). Ahora compone cada tema como lo hace el navegador
      # y además corre aquí — antes ni siquiera se ejecutaba en CI.
      - name: Contraste WCAG de la paleta (web)
        run: node apps/web/scripts/check-contrast.mjs --check

      - name: Test (con coverage informativo)
        run: pnpm test:coverage

      # Pruebas de MUTACIÓN (Stryker). BLOQUEANTE al 75 %.
      #
      # Mide lo que la cobertura no puede: si los tests **detectan** un cambio de
      # comportamiento, o solo pasan por la línea sin comprobar nada. Cambia el
      # código a propósito (un `>` por `>=`, un `&&` por `||`) y exige que algún
      # test se entere. Un mutante que sobrevive es una línea que se ejecuta pero
      # no se vigila — y esas son invisibles para el porcentaje de coverage.
      #
      # Acotado a la lógica pura crítica (autorización por rol, tokens de API,
      # lockout anti-fuerza-bruta y máquina de estados de la alarma) con su propia
      # config de Vitest: la campaña entera tarda ~15 s. Sin acotar, Stryker
      # re-ejecutaría los ~5 min de suite del agente **por cada mutante**.
      # Ver docs/qa.md § Mutación.
      - name: Mutation testing (lógica crítica de auth y alarma)
        run: pnpm qa:mutation

      # Auditoría de dependencias (AUD-23): una CVE **crítica** en dependencias de
      # PRODUCCIÓN bloquea el pipeline. Datos de **OSV** (binario pineado): npm
      # retiró sus endpoints legacy de audit (410 desde 2026-07-15) y pnpm aún no
      # habla el bulk (pnpm/pnpm#11265), así que `pnpm audit` se quedó sin datos.
      # `scripts/audit-osv.mjs` cruza el informe con `pnpm list --prod`: lo de dev
      # (vitest/vite/tar) se reporta sin bloquear; el resumen completo va al log
      # (cubre también la auditoría informativa de US-60).
      - name: Audit dependencies via OSV (blocking on prod critical)
        run: |
          # Con reintentos: la descarga falló con `curl: (35) Recv failure` y puso
          # `main` en rojo por la red del runner, no por el código. Un gate que se
          # cae solo enseña a ignorar el rojo, que es como se llega a cinco pushes
          # rotos sin que nadie lo mire.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=pnpm-lock.yaml --format=json > /tmp/osv.json || true
          node scripts/audit-osv.mjs /tmp/osv.json

  # Suite del agente y de la web en Windows (Fase 11). NO BLOQUEANTE al principio:
  # `continue-on-error: true` deja el job visible sin poner rojo el PR. Pasa a bloqueante
  # (se quita esa línea) cuando lleve 5 pasadas verdes seguidas en main. Los tests que no
  # aplican en Windows saltan con motivo y están contados en
  # apps/agent/test/unit/saltos-por-plataforma.test.ts.
  windows:
    name: Tests en Windows (no bloqueante)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      - name: Test (agente)
        run: pnpm --filter @krakenos/agent test

      # Aunque falle la del agente: la web es independiente y interesa ver las dos.
      - name: Test (web)
        if: ${{ !cancelled() }}
        run: pnpm --filter @krakenos/web test

  # Suite e2e de navegador (Playwright). US-189. Job aparte para no alargar
  # build-test; corre la app CONSTRUIDA con managers mock (ver docs/e2e.md).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys (agent)
        run: pnpm --filter @krakenos/agent keys:gen

      - name: Generate Prisma client
        run: pnpm --filter @krakenos/agent prisma:generate

      # El agente sirve apps/web/dist; e2e arranca el build, no el dev server.
      - name: Build
        run: pnpm build

      # Chromium + sus dependencias del sistema (libnspr4/libnss3/…): en el runner
      # de GitHub se instalan con --with-deps (apt vía sudo).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e

      # Trazas/vídeo/screenshots (solo se generan al fallar) como artefactos.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Smoke del instalador de un comando (US-216): corre en un Debian LIMPIO
  # (contenedor, sin Node preinstalado) desde la copia local del repo
  # (--from-local) y verifica que el agente construido responde /health/ready.
  # Sin systemd ni partes privilegiadas (no operan en contenedor, ver
  # docs/docker-limitations.md); esas se verifican en despliegue real (US-86).
  installer-smoke:
    name: Installer smoke (Debian limpio)
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run installer (from local tree, no service)
        run: |
          apt-get update -qq && apt-get install -y -qq curl git ca-certificates procps sudo
          # Con --no-service el instalador no crea el usuario; se crea aquí para que el
          # grupo del material TLS (root:krakenos) y las comprobaciones "como krakenos"
          # sean las de una instalación real.
          useradd --system --home /opt/krakenos --shell /usr/sbin/nologin krakenos
          bash scripts/install.sh --yes --no-service --dir /opt/krakenos --from-local "$PWD" | tee /tmp/install-1.log

      - name: Boot agent and probe /health/ready
        run: |
          cd /opt/krakenos/apps/agent
          NODE_ENV=production nohup node dist/index.js > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 30); do
            # HTTPS por defecto: sin Tailscale el instalador monta la CA local, así
            # que la sonda confía en ESA CA (no -k) y de paso prueba que el
            # certificado del servidor la valida para 127.0.0.1.
            if curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/health/ready > /dev/null 2>&1; then
              echo "health/ready OK (HTTPS, verificado contra la CA local)"
              exit 0
            fi
            sleep 1
          done
          echo "el agente no respondió a /health/ready"
          tail -50 /tmp/agent.log
          exit 1

      # AUD3-06: el instalador dejaba .env, la DB y data/ a 0644 → cualquier cuenta
      # local leía credenciales SSH del router, rtspUrl con contraseñas y hashes.
      - name: Secrets are not world-readable
        run: |
          agent=/opt/krakenos/apps/agent
          fail=0
          check() { # fichero_o_dir modo_esperado
            actual="$(stat -c '%a' "$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 tiene modo $actual, se esperaba $2"
              fail=1
            else
              echo "OK  $1 → $actual"
            fi
          }
          check "$agent/.env" 600
          check "$agent/keys" 700
          for f in "$agent"/keys/*.pem; do check "$f" 600; done
          for f in "$agent"/prisma/*.db; do [ -e "$f" ] && check "$f" 600; done
          exit $fail

      # AUD3-23: los extras se omitían en SILENCIO (sin TTY, confirm() decía "no").
      # Ahora son opt-in por bandera y lo que queda fuera se dice en voz alta.
      - name: Installer reports what was left out
        run: |
          grep -q "Qué quedó FUERA" /tmp/install-1.log
          grep -q -- "--with-ffmpeg" /tmp/install-1.log
          grep -q -- "--with-helper" /tmp/install-1.log
          echo "el resumen de extras omitidos está presente"

      # Idempotencia real: re-ejecutar NO debe regenerar .env ni las claves (sería
      # invalidar todas las sesiones y perder la config en cada reinstalación).
      - name: Re-run installer (idempotence)
        run: |
          agent=/opt/krakenos/apps/agent
          sha_before="$(sha256sum "$agent/.env" "$agent/keys/jwt-private.pem" | sha256sum)"
          # Marcador en data/ para comprobar que el estado del usuario se conserva.
          mkdir -p "$agent/data" && echo 'no me borres' > "$agent/data/smoke-marker"
          kill "$(cat /tmp/agent.pid)" 2>/dev/null || true
          bash scripts/install.sh --yes --no-service --dir /opt/krakenos --from-local "$PWD" > /tmp/install-2.log 2>&1 \
            || { tail -30 /tmp/install-2.log; exit 1; }
          sha_after="$(sha256sum "$agent/.env" "$agent/keys/jwt-private.pem" | sha256sum)"
          [ "$sha_before" = "$sha_after" ] || { echo "::error::la re-ejecución regeneró .env o las claves"; exit 1; }
          grep -q 'no me borres' "$agent/data/smoke-marker" || { echo "::error::se perdió data/"; exit 1; }
          echo "re-ejecución idempotente: .env, claves y data/ intactos"

      - name: Agent still boots after re-install
        run: |
          cd /opt/krakenos/apps/agent
          NODE_ENV=production nohup node dist/index.js > /tmp/agent2.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 30); do
            curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/health/ready > /dev/null 2>&1 && exit 0
            sleep 1
          done
          tail -50 /tmp/agent2.log
          exit 1

      # Root nunca ejecuta ni escribe nada que el usuario del servicio pueda modificar:
      # el árbol de instalación es suyo, así que el script de renovación (que ejecuta
      # un timer de root) y la clave de la CA viven fuera. Cada comprobación negativa
      # corre COMO el usuario del servicio.
      - name: TLS material is out of the service's reach
        run: |
          fail=0
          check() { # ruta propietario:grupo modo
            actual="$(stat -c '%U:%G %a' "$1")"
            if [ "$actual" != "$2 $3" ]; then echo "::error::$1 es $actual, se esperaba $2 $3"; fail=1; else echo "OK  $1 → $actual"; fi
          }
          check /usr/local/lib/krakenos root:root 755
          check /usr/local/lib/krakenos/local-ca.js root:root 755
          check /etc/krakenos/ca root:root 700
          check /etc/krakenos/ca/krakenos-ca-key.pem root:root 600
          check /etc/krakenos/tls root:krakenos 750
          check /etc/krakenos/tls/agent-key.pem root:krakenos 640
          # El servicio NO puede leer la clave de la CA ni modificar el script de root…
          if sudo -u krakenos test -r /etc/krakenos/ca/krakenos-ca-key.pem; then echo "::error::krakenos lee la clave de la CA"; fail=1; fi
          if sudo -u krakenos test -w /usr/local/lib/krakenos/local-ca.js; then echo "::error::krakenos puede escribir el script de root"; fail=1; fi
          # root ejecuta ese fichero con un node concreto (el del sistema si es de root; si
          # no, la copia de root en /usr/local/lib/krakenos/node): ni el node ni NINGUNO de
          # sus directorios pueden ser del servicio ni escribibles por él.
          node_bin="$(readlink -f "$(command -v node)")"
          if [ -e /usr/local/lib/krakenos/node ]; then node_bin=/usr/local/lib/krakenos/node; fi
          p="$node_bin"
          while :; do
            [ "$(stat -c %u "$p")" = 0 ] || { echo "::error::$p no es de root (lo ejecuta root)"; fail=1; }
            if sudo -u krakenos test -w "$p"; then echo "::error::krakenos puede escribir $p, que ejecuta root"; fail=1; fi
            [ "$p" = / ] && break
            p="$(dirname "$p")"
          done
          # La copia de root arranca SOLA (sin node_modules) y no toca la CA existente.
          before="$(sha256sum /etc/krakenos/tls/krakenos-ca.pem)"
          KRAKENOS_CERTS_DIR=/etc/krakenos/tls KRAKENOS_KEYS_DIR=/etc/krakenos/ca KRAKENOS_TLS_GROUP=krakenos \
            "$node_bin" /usr/local/lib/krakenos/local-ca.js || { echo "::error::la copia de root de local-ca.js falló"; fail=1; }
          [ "$before" = "$(sha256sum /etc/krakenos/tls/krakenos-ca.pem)" ] || { echo "::error::la renovación cambió la CA"; fail=1; }
          echo "OK  root ejecuta $node_bin /usr/local/lib/krakenos/local-ca.js"
          if sudo -u krakenos test -w /etc/krakenos/tls; then echo "::error::krakenos puede escribir en /etc/krakenos/tls"; fail=1; fi
          # …pero SÍ lee la clave del servidor (por grupo) para servir HTTPS.
          sudo -u krakenos test -r /etc/krakenos/tls/agent-key.pem || { echo "::error::krakenos no lee la clave del servidor"; fail=1; }
          # El .env apunta fuera del árbol de instalación.
          grep -q '^TLS_KEY_PATH=/etc/krakenos/tls/agent-key.pem$' /opt/krakenos/apps/agent/.env || { echo "::error::TLS_KEY_PATH no apunta a /etc/krakenos"; fail=1; }
          # mDNS: el paquete está instalado (en el contenedor no hay systemd/dbus, así
          # que NO se exige el demonio activo: sería un falso verde o un falso rojo).
          dpkg -s avahi-daemon > /dev/null 2>&1 || { echo "::error::avahi-daemon no está instalado"; fail=1; }
          exit $fail

      # La CA se publica sin auth (es pública por definición) y NUNCA se filtra una clave.
      - name: CA certificate is served and contains no private key
        run: |
          agent=/opt/krakenos/apps/agent
          curl -fsS --cacert /etc/krakenos/tls/krakenos-ca.pem https://127.0.0.1:3001/api/system/ca-cert -o /tmp/served-ca.crt
          ! grep -q "PRIVATE KEY" /tmp/served-ca.crt
          cmp /tmp/served-ca.crt /etc/krakenos/tls/krakenos-ca.pem
          echo "ca-cert servido, idéntico al fichero y sin claves"

      # --uninstall conserva los datos (lo que promete) y --purge no deja residuos.
      - name: Uninstall keeps data, purge leaves nothing
        run: |
          kill "$(cat /tmp/agent.pid)" 2>/dev/null || true
          bash scripts/install.sh --yes --uninstall --dir /opt/krakenos | tee /tmp/uninstall.log
          grep -q "Se conserva /opt/krakenos" /tmp/uninstall.log
          test -f /opt/krakenos/apps/agent/keys/jwt-private.pem || { echo "::error::--uninstall borró las claves"; exit 1; }
          test -f /opt/krakenos/apps/agent/data/smoke-marker || { echo "::error::--uninstall borró data/"; exit 1; }
          test ! -f /etc/systemd/system/krakenos.service
          bash scripts/install.sh --yes --uninstall --purge --dir /opt/krakenos
          test ! -d /opt/krakenos || { echo "::error::--purge dejó residuos en /opt/krakenos"; exit 1; }
          echo "uninstall/purge correctos"

  # Escaneo de secretos (gitleaks, BLOQUEANTE) + SAST (semgrep). US-92.
  # Job aparte para que corra en paralelo a build-test y falle de forma aislada.
  security:
    name: Secret scan · SAST
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` para que gitleaks escanee TODO el historial, no solo HEAD.
      - name: Checkout (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # (1) Secretos: BLOQUEA el build. Las joyas de la corona (keys/, .env, *.db)
      # están gitignored; gitleaks es la red de seguridad si alguien las commitea,
      # además de detectar claves privadas/tokens en cualquier fichero del historial.
      # Binario pin-eado a una versión exacta (sin "latest") → reproducible.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --verbose

      # (2) SAST: semgrep con engine pin-eado (imagen Docker por versión exacta) y
      # acotado al código fuente (src/), no a node_modules/tests/build. Reglas por
      # defecto + JS/TS. `--error` hace que cualquier hallazgo BLOQUEE el build.
      # Nota: los packs `p/*` se descargan del registro de semgrep en cada ejecución;
      # el engine está fijado, pero las reglas pueden evolucionar (ver reporte US-92).
      #
      # `--exclude-rule`: tres reglas son falsos positivos para este código y se
      # silencian de forma explícita (no se desactiva el resto del SAST):
      #   - express…direct-response-write: el backend es Fastify (API JSON, no HTML
      #     de Express); `reply.send` serializa JSON, no hay XSS reflejado.
      #   - detect-non-literal-regexp: el `new RegExp` de cisco-netconf.parsers usa un
      #     nombre de tag interno (no entrada de usuario), no es ReDoS explotable.
      #   - detect-insecure-websocket: el único match es un `ws://` dentro de un
      #     comentario doc de la CSP, no código.
      - name: SAST (semgrep)
        env:
          SEMGREP_VERSION: '1.95.0'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "semgrep/semgrep:${SEMGREP_VERSION}" \
            semgrep scan \
              --config p/default \
              --config p/javascript \
              --config p/typescript \
              --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write \
              --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
              --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
              --error \
              --metrics off \
              --disable-version-check \
              apps/agent/src apps/web/src packages/types/src

      # (3) shellcheck sobre los scripts de shell (US-231/AUD3-32). `install.sh`
      # son 400+ líneas que se ejecutan **como root** por `curl | sudo bash`, y
      # hasta ahora no pasaban por semgrep (acotado a `src/`) ni por ningún linter
      # de shell. El helper privilegiado va igual: es la última frontera antes de
      # root. BLOQUEANTE.
      - name: Shellcheck (scripts que corren como root)
        env:
          SHELLCHECK_VERSION: '0.10.0'
          SHELLCHECK_SHA256: '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
        run: |
          # Version fijada (el paquete de apt cambia con la imagen del runner) y tarball
          # verificado por sha256 antes de ejecutar nada.
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          export PATH="$RUNNER_TEMP/shellcheck:$PATH"
          shellcheck --version
          shellcheck --severity=warning \
            scripts/install.sh \
            apps/agent/scripts/krakenos-helper.sh \
            docker/entrypoint.sh
