name: Docker

# Construye y (en main / tags) publica la imagen del contenedor.
#   · build-image: verifica que la imagen construye y arranca (US-106). Corre en
#     PRs y push; NO publica.
#   · publish: sube la imagen a GHCR (US-117). Solo en push a main o tags v*.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      # US-231 (AUD3-33): estaba en `push.paths` pero NO aquí, así que un PR que
      # añadiera una dependencia nunca construía la imagen y el fallo aparecía ya
      # publicado en GHCR.
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t krakenos:ci .
      - name: Smoke — la imagen arranca y expone /health y /health/ready
        run: |
          docker run -d --name krakenos-ci -p 3001:3001 krakenos:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:3001/health/ready >/dev/null 2>&1; then
              echo "OK: /health y /health/ready respondieron"; ok=1; break
            fi
            sleep 3
          done
          docker logs krakenos-ci | tail -20
          docker rm -f krakenos-ci
          if [ "$ok" != "1" ]; then echo "FALLÓ: healthchecks no respondieron a tiempo"; exit 1; fi

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: build-image
    # Solo publica en push a main o en tags de versión; nunca en PRs de forks.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
