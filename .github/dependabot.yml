# Dependabot (actualizaciones de versión, semanales).
# Las actualizaciones de SEGURIDAD las abre Dependabot aparte de este calendario
# (en cuanto hay un aviso), con independencia de `schedule` y del límite de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
    labels: [dependencies]
    groups:
      # Menores y parches juntos en un solo PR; las mayores van sueltas.
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    labels: [dependencies]
